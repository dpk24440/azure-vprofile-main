trigger:
  branches:
    include:
      - main
      - stage
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  - group: vprofilevariables

stages:
  # Stage 1: Terraform Initialization (Download & Upload Binary)
  - stage: TerraformInit
    displayName: 'Terraform Initialization'
    jobs:
      - job: InitJob
        displayName: 'Initialize Terraform'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # Download and Prepare Terraform
          - task: Bash@3
            displayName: 'Download Terraform 1.6.3'
            inputs:
              targetType: 'inline'
              script: |
                mkdir -p $(Pipeline.Workspace)/tfbin
                curl -fsSL -o $(Pipeline.Workspace)/tfbin/terraform.zip https://releases.hashicorp.com/terraform/1.6.3/terraform_1.6.3_linux_amd64.zip
                unzip -o $(Pipeline.Workspace)/tfbin/terraform.zip -d $(Pipeline.Workspace)/tfbin/
                chmod +x $(Pipeline.Workspace)/tfbin/terraform
                echo "Terraform version:"
                $(Pipeline.Workspace)/tfbin/terraform version

          # Publish as Artifact
          - publish: $(Pipeline.Workspace)/tfbin
            artifact: terraform-bin

          # Terraform Init
          - script: |
              $(Pipeline.Workspace)/tfbin/terraform init \
                -backend-config="bucket=$(BUCKET_TF_STATE)" \
                -backend-config="key=terraform.tfstate" \
                -backend-config="region=$(AWS_REGION)" \
                -reconfigure
            displayName: 'Terraform Init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  # Stage 2: Terraform Format & Validate
  - stage: TerraformValidate
    displayName: 'Terraform Format & Validate'
    dependsOn: TerraformInit
    jobs:
      - job: ValidateJob
        displayName: 'Terraform Format Check & Validation'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              echo "##vso[task.setvariable variable=PATH]$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Add Terraform to PATH'

          - script: terraform fmt -check
            displayName: 'Terraform Format Check'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

          - script: terraform validate
            displayName: 'Terraform Validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  # Stage 3: Terraform Plan
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: TerraformValidate
    jobs:
      - job: PlanJob
        displayName: 'Terraform Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              echo "##vso[task.setvariable variable=PATH]$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Add Terraform to PATH'

          - task: Bash@3
            displayName: 'Terraform Plan'
            name: TerraformPlan
            continueOnError: true
            inputs:
              targetType: 'inline'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              script: terraform plan -no-color -input=false -out=planfile

          - task: Bash@3
            displayName: 'Fail if Terraform Plan Failed'
            condition: failed('TerraformPlan')
            inputs:
              targetType: 'inline'
              script: exit 1

  # Stage 4: Terraform Apply
  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ApplyJob
        displayName: 'Terraform Apply'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              echo "##vso[task.setvariable variable=PATH]$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Add Terraform to PATH'

          - task: Bash@3
            displayName: 'Terraform Apply (only on main)'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              script: terraform apply -auto-approve -input=false -parallelism=1 planfile

  # Stage 5: Configure AWS CLI
  - stage: AWSCLISetup
    displayName: 'Configure AWS CLI'
    dependsOn: TerraformApply
    jobs:
      - job: AWSCLIJob
        displayName: 'Configure AWS CLI'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AWSCLI@1
            displayName: 'Configure AWS CLI'
            inputs:
              awsCredentials: 'eks-aws-connection'
              regionName: '$(AWS_REGION)'

  # Stage 6: Update kubeconfig
  - stage: KubeconfigUpdate
    displayName: 'Update kubeconfig'
    dependsOn: AWSCLISetup
    jobs:
      - job: KubeconfigJob
        displayName: 'Update kubeconfig'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            name: GetKubeconfig
            displayName: 'Update kubeconfig'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              script: |
                aws eks update-kubeconfig --name $(EKS_CLUSTER) --region $(AWS_REGION)

  # Stage 7: Install NGINX Ingress Controller
  - stage: NGINXIngressInstall
    displayName: 'Install NGINX Ingress Controller'
    dependsOn: KubeconfigUpdate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: NGINXJob
        displayName: 'Install NGINX Ingress Controller'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: 'Install NGINX Ingress Controller'
            inputs:
              targetType: 'inline'
              script: |
                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
