trigger:
  branches:
    include:
      - main
      - stage
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  - group: vprofilevariables

stages:
- stage: TerraformStage
  displayName: 'Provision AWS Infrastructure with Terraform'
  jobs:
  - job: TerraformJob
    displayName: 'Terraform Apply & Post-Actions'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: Bash@3
      displayName: 'Install Terraform 1.6.3'
      inputs:
        targetType: 'inline'
        script: |
          curl -fsSL -o terraform.zip https://releases.hashicorp.com/terraform/1.6.3/terraform_1.6.3_linux_amd64.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform -version

    - task: Bash@3
      displayName: 'Terraform Init'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        script: |
          terraform init \
            -backend-config="bucket=$(BUCKET_TF_STATE)" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$(AWS_REGION)" \
            -reconfigure

    - task: Bash@3
      displayName: 'Terraform Format Check'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        script: terraform fmt -check

    - task: Bash@3
      displayName: 'Terraform Validate'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        script: terraform validate

    - task: Bash@3
      displayName: 'Terraform Plan'
      name: TerraformPlan
      continueOnError: true
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        script: terraform plan -no-color -input=false -out=planfile

    - task: Bash@3
      displayName: 'Fail if Terraform Plan Failed'
      condition: failed('TerraformPlan')
      inputs:
        targetType: 'inline'
        script: exit 1

    - task: Bash@3
      displayName: 'Terraform Apply (only on main)'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        script: terraform apply -auto-approve -input=false -parallelism=1 planfile

    - task: AWSCLI@1
      displayName: 'Configure AWS CLI'
      inputs:
        awsCredentials: 'eks-aws-connection'
        regionName: '$(AWS_REGION)'

    - task: Bash@3
      name: GetKubeconfig
      displayName: 'Update kubeconfig'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        script: |
          aws eks update-kubeconfig --name $(EKS_CLUSTER) --region $(AWS_REGION)

    - task: Bash@3
      displayName: 'Install NGINX Ingress Controller'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        targetType: 'inline'
        script: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
