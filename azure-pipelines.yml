trigger:
  branches:
    include:
      - main
      - stage
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  - group: vprofilevariables

stages:
# ------------------------------------------
# Terraform Init Stage
# ------------------------------------------
- stage: TerraformInit
  displayName: 'Terraform Init'
  jobs:
    - job: InitJob
      displayName: 'Initialize Terraform'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # Download and install Terraform
        - task: Bash@3
          displayName: 'Download and Install Terraform'
          inputs:
            targetType: 'inline'
            script: |
              curl -s -o terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
              unzip terraform.zip -d terraform-bin
              chmod +x terraform-bin/terraform

        # Publish Terraform binary as artifact for later stages
        - publish: terraform-bin
          artifact: terraform-bin

    # Separate job to download and use the published artifact
    - job: TerraformInit
      dependsOn: InitJob
      displayName: 'Run Terraform Init'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # Download the artifact from previous job
        - download: current
          artifact: terraform-bin

        # Ensure the terraform binary is executable
        - task: Bash@3
          displayName: 'Make Terraform Executable'
          inputs:
            targetType: 'inline'
            script: |
              chmod +x $(Pipeline.Workspace)/terraform-bin/terraform

        # Run Terraform Init
        - task: Bash@3
          displayName: 'Terraform Init'
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          inputs:
            targetType: 'inline'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            script: |
              export PATH=$(Pipeline.Workspace)/terraform-bin:$PATH
              terraform init


# ------------------------------------------
# Terraform Validate Stage
# ------------------------------------------
- stage: TerraformValidate
  displayName: 'Terraform Format & Validate'
  dependsOn: TerraformInit
  jobs:
    - job: ValidateJob
      displayName: 'Validate Terraform Code'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - download: current
          artifact: terraform-bin

        # Fix: Make the Terraform binary executable
        - task: Bash@3
          displayName: 'Make Terraform Executable'
          inputs:
            targetType: 'inline'
            script: |
              chmod +x $(Pipeline.Workspace)/terraform-bin/terraform

        - task: Bash@3
          displayName: 'Terraform Fmt & Validate'
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          inputs:
            targetType: 'inline'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            script: |
              export PATH=$(Pipeline.Workspace)/terraform-bin:$PATH
              terraform fmt -check
              terraform validate

# ------------------------------------------
# Terraform Plan Stage
# ------------------------------------------
- stage: TerraformPlan
  displayName: 'Terraform Plan'
  dependsOn: TerraformValidate
  jobs:
    - job: PlanJob
      displayName: 'Generate Terraform Plan'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - download: current
          artifact: terraform-bin

        - task: Bash@3
          displayName: 'Terraform Plan'
          inputs:
            targetType: 'inline'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            script: |
              export PATH=$(Pipeline.Workspace)/terraform-bin:$PATH
              terraform plan -out=tfplan

        - publish: $(System.DefaultWorkingDirectory)/terraform/tfplan
          artifact: tfplan

# ------------------------------------------
# Terraform Apply Stage
# ------------------------------------------
- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: ApplyJob
      displayName: 'Apply Terraform Changes'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        - download: current
          artifact: terraform-bin

        - download: current
          artifact: tfplan

        # Apply Terraform changes
        - task: AWSCLI@1
          inputs:
            awsCredentials: 'eks-aws-connection'
            regionName: 'ap-northeast-1'

        - task: Bash@3
          displayName: 'Terraform Apply'
          inputs:
            targetType: 'inline'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
            script: |
              export PATH=$(Pipeline.Workspace)/terraform-bin:$PATH
              terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
