trigger:
  branches:
    include:
      - main
      - stage
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  - group: vprofilevariables

stages:
  # Stage 1: Terraform Init
  - stage: TerraformInit
    displayName: 'Terraform Initialization'
    jobs:
      - job: InitJob
        displayName: 'Initialize Terraform'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Download and Setup Terraform 1.6.3'
            inputs:
              targetType: 'inline'
              script: |
                mkdir -p $(Pipeline.Workspace)/terraform-bin
                curl -fsSL -o $(Pipeline.Workspace)/terraform-bin/terraform.zip https://releases.hashicorp.com/terraform/1.6.3/terraform_1.6.3_linux_amd64.zip
                unzip -o $(Pipeline.Workspace)/terraform-bin/terraform.zip -d $(Pipeline.Workspace)/terraform-bin/
                chmod +x $(Pipeline.Workspace)/terraform-bin/terraform
                $(Pipeline.Workspace)/terraform-bin/terraform version

          - publish: $(Pipeline.Workspace)/terraform-bin
            artifact: terraform-bin

          - script: |
              $(Pipeline.Workspace)/terraform-bin/terraform init \
                -backend-config="bucket=$(BUCKET_TF_STATE)" \
                -backend-config="key=terraform.tfstate" \
                -backend-config="region=$(AWS_REGION)" \
                -reconfigure
            displayName: 'Terraform Init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  # Stage 2: Terraform Validate
  - stage: TerraformValidate
    displayName: 'Terraform Format & Validate'
    dependsOn: TerraformInit
    jobs:
      - job: ValidateJob
        displayName: 'Terraform Format & Validate'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              chmod +x $(Pipeline.Workspace)/terraform-bin/terraform
              echo "##vso[task.setvariable variable=PATH]=$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Make Terraform Executable and Add to PATH'

          - task: Bash@3
            displayName: 'Terraform Fmt and Validate'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              script: |
                terraform fmt -check
                terraform validate

  # Stage 3: Terraform Plan
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: TerraformValidate
    jobs:
      - job: PlanJob
        displayName: 'Terraform Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              chmod +x $(Pipeline.Workspace)/terraform-bin/terraform
              echo "##vso[task.setvariable variable=PATH]=$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Make Terraform Executable and Add to PATH'

          - task: Bash@3
            displayName: 'Terraform Plan'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              script: |
                terraform plan -no-color -input=false -out=planfile

  # Stage 4: Terraform Apply
  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ApplyJob
        displayName: 'Terraform Apply'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - download: current
            artifact: terraform-bin

          - script: |
              chmod +x $(Pipeline.Workspace)/terraform-bin/terraform
              echo "##vso[task.setvariable variable=PATH]=$(Pipeline.Workspace)/terraform-bin:$(PATH)"
            displayName: 'Make Terraform Executable and Add to PATH'

          - task: Bash@3
            displayName: 'Terraform Apply (only on main)'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              script: terraform apply -auto-approve -input=false -parallelism=1 planfile

  # Stage 5: AWS CLI Configuration
  - stage: AWSCLISetup
    displayName: 'Configure AWS CLI'
    dependsOn: TerraformApply
    jobs:
      - job: AWSCLIJob
        displayName: 'Configure AWS CLI'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AWSCLI@1
            displayName: 'Configure AWS CLI'
            inputs:
              awsCredentials: 'eks-aws-connection'
              regionName: '$(AWS_REGION)'

  # Stage 6: Update Kubeconfig
  - stage: KubeconfigUpdate
    displayName: 'Update kubeconfig'
    dependsOn: AWSCLISetup
    jobs:
      - job: KubeconfigJob
        displayName: 'Update kubeconfig'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Bash@3
            name: GetKubeconfig
            displayName: 'Update kubeconfig'
            inputs:
              targetType: 'inline'
              script: aws eks update-kubeconfig --name $(EKS_CLUSTER) --region $(AWS_REGION)

  # Stage 7: Install NGINX Ingress Controller
  - stage: NGINXIngressInstall
    displayName: 'Install NGINX Ingress Controller'
    dependsOn: KubeconfigUpdate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: NGINXJob
        displayName: 'Install NGINX Ingress Controller'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: 'Install NGINX Ingress Controller'
            inputs:
              targetType: 'inline'
              script: |
                kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
